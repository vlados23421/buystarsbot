services:
  - type: web
    name: telegram-stars-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MYSTARS_API_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: RENDER_EXTERNAL_URL
        fromService:
          name: telegram-stars-bot
          type: web
          property: url
